[package]
name = "jarvis-rsd-probe-ffi"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false

[lib]
name = "jarvis_rsd_probe"
crate-type = ["staticlib", "rlib"]

[dependencies]
idevice = { path = "../vendor/idevice/idevice", default-features = false, features = [
  "dtx_channel_probe",
  "remote_pairing",
  "ring",
  "rsd",
  "tunnel_tcp_stack",
  "xctest",
] }
tokio = { version = "1", features = ["net", "rt-multi-thread", "time"] }

[profile.release]
opt-level = "z"
codegen-units = 1
# Xcode's Apple LLVM tools cannot consume embedded bitcode produced by a
# newer upstream LLVM. Final app dead-stripping remains enabled in Xcode.
lto = false
panic = "abort"
# Preserve the two C ABI exports in the archive; Xcode strips the final app.
strip = "debuginfo"
