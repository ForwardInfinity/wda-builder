name: JarvisRSDProbe
options:
  minimumXcodeGenVersion: 2.40.0
  deploymentTarget:
    iOS: "17.4"
settings:
  base:
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "17.4"
    TARGETED_DEVICE_FAMILY: "1"
    CODE_SIGNING_ALLOWED: NO
    CODE_SIGNING_REQUIRED: NO
    CODE_SIGN_IDENTITY: ""
    PRODUCT_BUNDLE_IDENTIFIER: com.forwardinfinity.jarvisrsdprobe
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    DEAD_CODE_STRIPPING: YES
    STRIP_INSTALLED_PRODUCT: YES
    COPY_PHASE_STRIP: YES
    HEADER_SEARCH_PATHS: "$(PROJECT_DIR)/../include"
    SWIFT_INCLUDE_PATHS: "$(PROJECT_DIR)/../include"
    LIBRARY_SEARCH_PATHS: "$(PROJECT_DIR)/../rust/target/aarch64-apple-ios/release"
    OTHER_LDFLAGS: "$(inherited) -ljarvis_rsd_probe"
targets:
  JarvisRSDProbe:
    type: application
    platform: iOS
    sources:
      - path: Sources
    settings:
      base:
        PRODUCT_NAME: JarvisRSDProbe
        PRODUCT_MODULE_NAME: JarvisRSDProbe
        TARGETED_DEVICE_FAMILY: "1"
        INFOPLIST_FILE: Sources/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: ""
    scheme:
      testTargets: []
