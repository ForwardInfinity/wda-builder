name: Build WDA for iOS 18 (merged xctest)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - name: Checkout WebDriverAgent
        uses: actions/checkout@v4
        with:
          repository: appium/WebDriverAgent
          ref: master
          submodules: true

      - name: Setup Xcode 16
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26'

      - name: Show versions
        run: |
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version

      - name: Bootstrap
        run: |
          if [ -f "./Scripts/bootstrap.sh" ]; then
            bash ./Scripts/bootstrap.sh -d
          fi

      - name: Patch test class (drop FBFailureProofTestCase for iOS 26)
        run: |
          # iOS 26.6: FBFailureProofTestCase private-API overrides deadlock the runner
          sed -i 's|#import <WebDriverAgentLib/FBFailureProofTestCase.h>|// patched: no FBFailureProofTestCase|' WebDriverAgentRunner/UITestingUITests.m
          sed -i 's/@interface UITestingUITests : FBFailureProofTestCase <FBWebServerDelegate>/@interface UITestingUITests : XCTestCase <FBWebServerDelegate>/' WebDriverAgentRunner/UITestingUITests.m
          grep -n "XCTestCase <FBWebServerDelegate>" WebDriverAgentRunner/UITestingUITests.m || echo "PATCH FAILED" 

      - name: Build WDA
        run: |
          xcodebuild \
            -project WebDriverAgent.xcodeproj \
            -scheme WebDriverAgentRunner \
            -sdk iphoneos \
            -configuration Release \
            -destination generic/platform=iOS \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            ARCHS=arm64 \
            ONLY_ACTIVE_ARCH=NO \
            ASSETCATALOG_COMPILER_APPICON_NAME= \
            ASSETCATALOG_COMPILER_GENERATE_ASSET_SYMBOLS=NO \
            clean build \
            CONFIGURATION_BUILD_DIR=$PWD/build

      - name: Verify build output
        run: |
          APP="$PWD/build/WebDriverAgentRunner-Runner.app"
          ls -la "$APP/"
          echo "--- PlugIns ---"
          ls -la "$APP/PlugIns/" 2>/dev/null || echo "(no PlugIns dir)"
          echo "--- Frameworks ---"
          ls -la "$APP/Frameworks/" 2>/dev/null || echo "(no Frameworks dir)"
          file "$APP/WebDriverAgentRunner-Runner" 2>/dev/null

      - name: Package IPA
        run: |
          mkdir Payload
          cp -r build/WebDriverAgentRunner-Runner.app Payload/
          zip -r WebDriverAgent-iOS18.ipa Payload/
          ls -lh WebDriverAgent-iOS18.ipa

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: WDA-iOS18-v2
          path: WebDriverAgent-iOS18.ipa
          retention-days: 30

# force rescan
