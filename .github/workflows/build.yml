name: Build standalone Jarvis iOS agent

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 25
    steps:
      - name: Checkout builder
        uses: actions/checkout@v4

      - name: Setup Xcode 26
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26'

      - name: Show iOS 26 BackgroundTasks declarations
        run: |
          SDK="$(xcrun --sdk iphoneos --show-sdk-path)"
          grep -n -A 100 -B 10 'BGContinuedProcessing' "$SDK/System/Library/Frameworks/BackgroundTasks.framework/Headers/BackgroundTasks.h"

      - name: Install XcodeGen
        run: |
          if ! command -v xcodegen >/dev/null; then
            brew install xcodegen
          fi
          xcodegen --version

      - name: Generate project
        working-directory: agent/ios/JarvisAgent
        run: |
          set -euo pipefail
          xcodegen generate
          xcodebuild -project JarvisAgent.xcodeproj -scheme JarvisAgent -showBuildSettings >/tmp/build-settings.txt
          grep -q 'PRODUCT_BUNDLE_IDENTIFIER = com.forwardinfinity.jarvisagent' /tmp/build-settings.txt
          ! grep -R -E 'Bearer [A-Za-z0-9_-]{20,}|ntfy-topic|jarvis/passcode' Sources

      - name: Build unsigned arm64 app
        working-directory: agent/ios/JarvisAgent
        run: |
          set -euo pipefail
          xcodebuild \
            -project JarvisAgent.xcodeproj \
            -scheme JarvisAgent \
            -sdk iphoneos \
            -configuration Release \
            -destination generic/platform=iOS \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            ARCHS=arm64 \
            ONLY_ACTIVE_ARCH=NO \
            ASSETCATALOG_COMPILER_APPICON_NAME= \
            clean build \
            CONFIGURATION_BUILD_DIR="$PWD/build"

      - name: Verify and package
        working-directory: agent/ios/JarvisAgent
        run: |
          set -euo pipefail
          APP="$PWD/build/JarvisAgent.app"
          BIN="$APP/JarvisAgent"
          test -x "$BIN"
          /usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$APP/Info.plist" | grep -qx com.forwardinfinity.jarvisagent
          /usr/libexec/PlistBuddy -c 'Print :UIBackgroundModes:0' "$APP/Info.plist" | grep -qx fetch
          /usr/libexec/PlistBuddy -c 'Print :NSAppTransportSecurity:NSAllowsLocalNetworking' "$APP/Info.plist" | grep -qx true
          strings "$BIN" > /tmp/jarvis-agent.strings
          grep -q 'workbox.tailfd8ac6.ts.net' /tmp/jarvis-agent.strings
          grep -q 'ios-standalone-16' /tmp/jarvis-agent.strings
          grep -q 'ios-background-stream-2' /tmp/jarvis-agent.strings
          grep -q 'Jarvis cellular recovery' /tmp/jarvis-agent.strings
          grep -q 'probe-local-control' /tmp/jarvis-agent.strings
          grep -q 'wda-launch-settings' /tmp/jarvis-agent.strings
          grep -q 'wda-keyboard-probe' /tmp/jarvis-agent.strings
          grep -q 'secure-unlock' /tmp/jarvis-agent.strings
          grep -q 'start-rsd-relay' /tmp/jarvis-agent.strings
          grep -q '/v1/rsd-relay/open' /tmp/jarvis-agent.strings
          cat > "$APP/JarvisAgentBuild.json" <<'JSON'
          {"agent":"standalone-reverse-control","version":16,"channel":"ios26-fixed-rsd-relay-secure-unlock"}
          JSON
          rm -rf Payload
          mkdir Payload
          cp -R "$APP" Payload/
          /usr/bin/zip -qry JarvisAgent-unsigned-v16.ipa Payload
          BYTES="$(stat -f%z JarvisAgent-unsigned-v16.ipa)"
          echo "IPA_BYTES=$BYTES"
          test "$BYTES" -gt 50000
          shasum -a 256 JarvisAgent-unsigned-v16.ipa

      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: JarvisAgent-unsigned-v16
          path: agent/ios/JarvisAgent/JarvisAgent-unsigned-v16.ipa
          retention-days: 14
          if-no-files-found: error
