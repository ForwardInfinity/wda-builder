name: Build Jarvis iOS agent v21r2 physical-lock reveal

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - name: Checkout builder
        uses: actions/checkout@v4

      - name: Setup Xcode 26
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26'

      - name: Setup pinned toolchains
        run: |
          set -euo pipefail
          rustup toolchain install 1.98.0 --profile minimal
          rustup default 1.98.0
          rustup target add aarch64-apple-ios
          if ! command -v xcodegen >/dev/null; then brew install xcodegen; fi
          xcodebuild -version
          rustc --version
          xcodegen --version

      - name: Static full-UI and fixed-secret policy
        env:
          JARVIS_SKIP_V19_BASELINE: '1'
        run: |
          set -euo pipefail
          python3 agent/test_v21_full_ui_policy.py
          python3 agent/test_ui_server.py
          python3 agent/test_v21_lifecycle_soak.py
          python3 -m py_compile agent/jarvis_v21_lifecycle_soak.py
          python3 experiments/ondevice-rsd-probe/tests/test_static_policy.py
          ! grep -R -E 'Bearer [A-Za-z0-9_-]{20,}|ntfy-topic|jarvis/passcode' \
            agent/ios/JarvisAgentV21/Sources \
            experiments/ondevice-rsd-probe/rust/src \
            experiments/ondevice-rsd-probe/include

      - name: Build pinned fixed-controller library
        run: |
          set -euo pipefail
          experiments/ondevice-rsd-probe/scripts/prepare_vendor.sh
          cargo build \
            --manifest-path experiments/ondevice-rsd-probe/rust/Cargo.toml \
            --locked --release --target aarch64-apple-ios

      - name: Build unsigned full-UI agent
        working-directory: agent/ios/JarvisAgentV21
        run: |
          set -euo pipefail
          xcodegen generate
          xcodebuild \
            -project JarvisAgentV21.xcodeproj \
            -scheme JarvisAgentV21 \
            -sdk iphoneos \
            -configuration Release \
            -destination generic/platform=iOS \
            CODE_SIGN_IDENTITY='' \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            ARCHS=arm64 \
            ONLY_ACTIVE_ARCH=NO \
            ASSETCATALOG_COMPILER_APPICON_NAME= \
            clean build \
            CONFIGURATION_BUILD_DIR="$PWD/build"

      - name: Verify and package
        working-directory: agent/ios/JarvisAgentV21
        run: |
          set -euo pipefail
          APP="$PWD/build/JarvisAgent.app"
          BIN="$APP/JarvisAgent"
          test -x "$BIN"
          /usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$APP/Info.plist" | grep -qx com.forwardinfinity.jarvisagent
          /usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$APP/Info.plist" | grep -qx 0.21.2
          /usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$APP/Info.plist" | grep -qx 27
          /usr/libexec/PlistBuddy -c 'Print :MinimumOSVersion' "$APP/Info.plist" | grep -qx 26.0
          /usr/libexec/PlistBuddy -c 'Print :BGTaskSchedulerPermittedIdentifiers:1' "$APP/Info.plist" | grep -qx 'com.forwardinfinity.jarvisagent.recovery.*'
          strings "$BIN" > /tmp/jarvis-agent-v21.strings
          for required in \
            'ios-standalone-21r2-full-ui' \
            'jarvis-fixed-lock-reveal' \
            '/jarvis-ui/v1/poll' \
            '/jarvis-ui/v1/result' \
            'INTEGRATED JARVIS CONTROLLER + WDA PASS' \
            '10.7.0.1' \
            'http://127.0.0.1:8100/status' \
            'secure-unlock' \
            'performIoHidEvent'; do
            grep -Fq "$required" /tmp/jarvis-agent-v21.strings || { echo "required marker absent: $required" >&2; exit 3; }
          done
          for forbidden in \
            'refresh-stream' \
            'probe-tunnel-services' \
            'probe-private-hid' \
            'start-rsd-relay' \
            '/v1/rsd-relay/'; do
            ! grep -Fxq "$forbidden" /tmp/jarvis-agent-v21.strings || { echo "forbidden marker present: $forbidden" >&2; exit 3; }
          done
          cat > "$APP/JarvisAgentBuild.json" <<'JSON'
          {"agent":"standalone-full-ui","version":"21r2","controller":"fixed-ondevice-xctest-wda","transport":"10.7.0.1:49152","execution_owner":"single-visible-allocation","full_ui":"explicit-unlocked-at-most-once","secret_plane":"fixed-device-only","dark_keypad_gate":"fixed-reveal-plus-bounded-read-only-source-retry"}
          JSON
          rm -rf Payload
          mkdir Payload
          cp -R "$APP" Payload/
          /usr/bin/zip -qry JarvisAgent-unsigned-v21r2.ipa Payload
          chmod 600 JarvisAgent-unsigned-v21r2.ipa
          test "$(stat -f%z JarvisAgent-unsigned-v21r2.ipa)" -gt 500000
          shasum -a 256 JarvisAgent-unsigned-v21r2.ipa | tee JarvisAgent-v21r2.sha256

      - name: Upload unsigned full-UI agent
        uses: actions/upload-artifact@v4
        with:
          name: JarvisAgent-unsigned-v21r2
          path: |
            agent/ios/JarvisAgentV21/JarvisAgent-unsigned-v21r2.ipa
            agent/ios/JarvisAgentV21/JarvisAgent-v21r2.sha256
          retention-days: 7
          if-no-files-found: error
