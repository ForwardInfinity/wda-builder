name: JarvisAgent
options:
  minimumXcodeGenVersion: 2.40.0
  deploymentTarget:
    iOS: "15.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "15.0"
    TARGETED_DEVICE_FAMILY: "1"
    CODE_SIGNING_ALLOWED: NO
    CODE_SIGNING_REQUIRED: NO
    CODE_SIGN_IDENTITY: ""
    PRODUCT_BUNDLE_IDENTIFIER: com.forwardinfinity.jarvisagent
    MARKETING_VERSION: "0.4.0"
    CURRENT_PROJECT_VERSION: "4"
targets:
  JarvisAgent:
    type: application
    platform: iOS
    sources:
      - path: Sources
    settings:
      base:
        PRODUCT_NAME: JarvisAgent
        PRODUCT_MODULE_NAME: JarvisAgent
        INFOPLIST_FILE: Sources/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: ""
        GENERATE_INFOPLIST_FILE: NO
    scheme:
      testTargets: []
